name: probe
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: "python snippet to run (debug only, nothing is committed)"
        required: true
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests==2.32.3 beautifulsoup4 lxml
      - name: run
        env: {CMD: "${{ github.event.inputs.cmd }}"}
        run: |
          mkdir -p out && python -c "$CMD" > out/probe.txt 2>&1 || true
          cat out/probe.txt
      - name: publish output to branch probe-out
        run: |
          git config user.name job-crawler-bot; git config user.email job-crawler-bot@users.noreply.github.com
          git checkout --orphan probe-out && git rm -rq --cached . && git add -f out
          git commit -qm probe && git push -f origin probe-out
