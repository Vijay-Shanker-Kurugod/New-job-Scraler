name: daily-crawl

on:
  schedule:
    - cron: "15 4 * * *"      # 05:15 UTC = 06:15 Berlin (winter) / 07:15 (summer); Claude scan runs 07:47 Berlin
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 playwright==1.48.0
      - name: Install headless Chromium
        run: python -m playwright install --with-deps chromium
      - name: Crawl Arbeitsagentur + job boards + employer career pages
        run: python -u crawl.py
      - name: Commit results
        run: |
          git config user.name  "job-crawler-bot"
          git config user.email "job-crawler-bot@users.noreply.github.com"
          git add data state
          git commit -m "crawl $(date -u +%F)" || echo "nothing new"
          git pull --rebase --autostash
          git push
